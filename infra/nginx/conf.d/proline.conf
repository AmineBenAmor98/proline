# The edge. Terminates TLS and proxies everything to the app container.
#
# Mounted read-only at /etc/nginx/conf.d/ inside the nginx container, which the
# stock image includes at `http` level -- so the `map`, `gzip` and `ssl_session_*`
# directives below are legal here, and this one file is the whole configuration.
# Mounting the directory also hides the image's own default.conf, which is what
# you want: nothing serves a stray "Welcome to nginx".
#
# It is mounted FROM THE GIT CHECKOUT (see docker-compose.prod.yml), not copied
# to /srv/proline. So `git pull` updates it and the next reload picks it up --
# there is no second copy on the box to drift out of date.
#
# The certificate is NOT managed here. certbot writes it into the shared
# certbot_conf volume and nginx reloads every six hours to pick up a renewal;
# infra/nginx/init-letsencrypt.sh issues the first one. See the long comment in
# that script for why the first one needs a script at all.

# X-Robots-Tag, computed once per request instead of set per location.
#
# THIS IS NOT PREMATURE CLEVERNESS -- it is working around nginx's nastiest
# footgun. `add_header` is not additive across levels: a location with its own
# `add_header` DISCARDS every inherited one. So the obvious translation of the
# Caddyfile -- security headers on the server, one more header in a /admin
# location -- silently drops HSTS and the rest on exactly the URL that most
# needs them. Computing the value here keeps all the headers at one level, where
# nothing can shadow them. nginx omits an `add_header` whose value is empty, so
# every other URL simply does not get this header.
map $uri $robots_tag {
    default   "";
    ~^/admin  "noindex, nofollow";
}

gzip              on;
gzip_vary         on;       # tells caches the response varies by Accept-Encoding
gzip_proxied      any;
gzip_comp_level   6;
gzip_min_length   256;      # below this the gzip header costs more than it saves
# text/html is always compressed and must not be listed.
# No zstd: nginx cannot do it without a third-party module, so the Caddyfile's
# `encode gzip zstd` becomes gzip only. Costs a few percent on text, nothing else.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

# Caddy's `-Server`. nginx cannot remove the header outright without the
# third-party headers-more module; `off` is as far as the stock build goes -- it
# drops the version, leaving a bare `Server: nginx`. The version was the part
# worth hiding.
server_tokens off;

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;   # let the client pick; modern clients choose better
# ECDHE only, deliberately. The DHE suites in Mozilla's intermediate list are the
# only reason a dhparam file would be needed, and nothing from the last decade
# requires them -- so there is no dhparam file to generate, store or forget.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
# No OCSP stapling. Let's Encrypt stopped issuing OCSP responder URLs in 2025, so
# there is nothing to staple -- turning it on would only log warnings and add a
# chain.pem dependency to the bootstrap.

# ---------------------------------------------------------------------------
# Port 80: the ACME challenge, and a redirect for everything else.
#
# Caddy did both of these without being asked. They are the two lines people
# forget when they move off it -- and forgetting the first one means the
# certificate cannot be renewed, which fails silently 60 days later.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name proline-cleaningsolutions.com www.proline-cleaningsolutions.com;

    # Must come before the redirect below. Let's Encrypt follows redirects on
    # HTTP-01, so a redirect here would technically work today -- but it sends
    # the validator to a URL that only exists over TLS, which is the circular
    # dependency this whole file is trying to avoid. Serve it from disk.
    location /.well-known/acme-challenge/ {
        root         /var/www/certbot;   # certbot writes .well-known/... under here
        default_type "text/plain";
    }

    # $host, not a hardcoded name: www stays www and the apex stays the apex,
    # which is what Caddy did. Both names are served, neither redirects to the
    # other. (If you ever want one canonical host for SEO, that is a deliberate
    # change to make on purpose, not a side effect of this file.)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name proline-cleaningsolutions.com www.proline-cleaningsolutions.com;

    # One certificate covering both names. The path is the certbot lineage name,
    # which is the FIRST -d argument in init-letsencrypt.sh -- change the order
    # there and this path goes stale, so don't.
    ssl_certificate     /etc/letsencrypt/live/proline-cleaningsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proline-cleaningsolutions.com/privkey.pem;

    # The default is 1m, and a request over it is rejected with a bare 413 that
    # looks like a broken form rather than a limit. Quote payloads are a few KB.
    client_max_body_size 2m;

    # Docker's embedded DNS. Needed because the upstream below is named through a
    # variable -- see the comment on it. `valid=10s` caps how long a dead
    # container's address can be cached; ipv6=off because the instance is IPv4
    # only (compute.py) and an AAAA lookup would just fail on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # All four headers in one place, on purpose -- see the map comment at the top.
    # `always` so they are sent on error responses too, which is where a missing
    # nosniff actually bites.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag              $robots_tag always;

    # Renewals are served over 443 too if a redirect ever puts them here.
    location /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    # The app serves its own static files out of FRONTEND_DIR, so there is
    # nothing for nginx to split out and no shared volume between the two.
    location / {
        # THE VARIABLE IS THE POINT, and this is the one thing in this file that
        # nginx gets wrong by default in a way that would bite on a routine
        # deploy.
        #
        # Written the obvious way -- `proxy_pass http://app:8000;` -- nginx
        # resolves `app` ONCE, at startup, and caches that container IP forever.
        # It also refuses to start at all if the name does not resolve yet. So
        # `git pull && up -d --build`, which replaces the app container while
        # nginx keeps running, can leave nginx proxying to an address that no
        # longer exists: every request 502s until someone reloads it. Caddy
        # resolved per connection and so never had this failure.
        #
        # Naming the upstream through a variable moves resolution to request time
        # (which is also why `resolver` above is mandatory). Then a missing app
        # container is a 502 that clears by itself, not a wedged edge.
        #
        # $request_uri must be appended explicitly: once proxy_pass contains a
        # variable, nginx stops deriving the upstream URI for you. Using the raw
        # $request_uri is what we want here anyway -- this is a pass-through.
        set $upstream http://app:8000;
        proxy_pass $upstream$request_uri;

        # Host, or the app sees `app:8000` and every absolute URL it builds --
        # redirects, canonical links, the offer email's links -- points at a
        # hostname that only exists on the compose network. Caddy passed the
        # original Host through by default; nginx does not.
        proxy_set_header Host              $host;

        # $remote_addr, NOT $proxy_add_x_forwarded_for. The usual snippet appends
        # to whatever X-Forwarded-For arrived, which is right for an inner proxy
        # and wrong for the edge: a client can send its own header and prepend a
        # fake hop. This is the edge, so overwrite. Matches Caddy's {remote_host}.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Default is 1.0, which closes the upstream connection on every request
        # and breaks chunked responses. Clearing Connection is what actually
        # enables keepalive rather than passing the client's value through.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}

# ---------------------------------------------------------------------------
# Anything arriving with a Host we do not serve -- which on a public IP means
# scanners, within hours of the box existing.
#
# Without these, nginx makes the FIRST server block the default and hands the
# real site to every one of them, so the access log fills with someone else's
# domain name and the site answers on an address it was never meant to.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # The container healthcheck. Deliberately on the catch-all rather than the
    # site, so `docker compose ps` reports on nginx itself and not on whether
    # DNS, TLS and the app all happen to be working.
    location = /nginx-healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 444: close the connection without a response. Nothing to fingerprint.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    # Refuses the TLS handshake outright, so this block needs no certificate --
    # which is the point: there is no self-signed filler here to expire or to
    # confuse the bootstrap script.
    ssl_reject_handshake on;
}
