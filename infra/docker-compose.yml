# Local development: one command brings up Postgres, the schema, a rate card
# and the site.   docker compose -f infra/docker-compose.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proline
      POSTGRES_PASSWORD: proline
      POSTGRES_DB: proline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proline"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://proline:proline@db:5432/proline
      FRONTEND_DIR: /app/frontend
    ports: ["8000:8000"]
    volumes:
      # Code and pages are mounted, so edits reload without a rebuild.
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../frontend:/app/frontend
      # Tests run in the same container: make test
      - ../backend/tests:/app/tests
      - ../backend/pytest.ini:/app/pytest.ini
      - ../backend/requirements-dev.txt:/app/requirements-dev.txt
    depends_on:
      db: {condition: service_healthy}
    # Schema, then a placeholder rate card (idempotent), then the server.
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_rate_card &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
