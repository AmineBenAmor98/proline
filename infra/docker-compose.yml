services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proline
      POSTGRES_PASSWORD: proline
      POSTGRES_DB: proline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proline"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://proline:proline@db:5432/proline
    ports: ["8000:8000"]
    volumes:
      - ../backend/app:/app/app
      - ../frontend:/app/frontend
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
