# Production: one Lightsail instance in ca-central-1 (Montreal), $12/month.
# Everything runs here.
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# WHY ONE BOX. Every managed platform we priced charges $15-20 for a database
# and another $18 for TLS termination and routing. Both of those are containers
# on a machine you already rent. At this scale -- a form and a lead table -- the
# managed versions are buying convenience, not resilience: the $15 database
# tiers are single instances too, so a host failure means restoring from backup
# either way. What you are actually buying here, for $12, is the same recovery
# story -- provided the recovery point below is real.
#
# Four containers: the app, Postgres, nginx, and a certbot that does nothing but
# renew. TLS is two containers rather than one because nginx does not manage
# certificates -- see the nginx service below and infra/nginx/init-letsencrypt.sh.
#
# WHERE THE RECOVERY POINT COMES FROM. The instance's daily whole-disk snapshot,
# and nothing else. That is one recovery point per day, and a restore rebuilds the
# instance rather than restoring a file -- see infra/DEPLOY.md. The database lives
# in the pgdata volume on that same disk, so the snapshot does cover it.
name: proline

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proline
      POSTGRES_DB: proline
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Never published to the host. The database is reachable only on the compose
    # network: an open 5432 on a public IP is found by scanners within hours.
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proline -d proline"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    # Built on the box, not pulled. A registry would mean a CI workflow, a
    # publish token and a pull credential on the instance -- three things to keep
    # working in exchange for saving a 90-second build on a machine that deploys
    # by `git pull`. Worth adding the day there is a staging environment to keep
    # identical, or a rollback that has to reach a specific published tag.
    build:
      context: ..
      dockerfile: Dockerfile
    image: proline-app:latest
    restart: unless-stopped
    env_file: /srv/proline/.env
    environment:
      ENVIRONMENT: production
      FRONTEND_DIR: /app/frontend
      # Customer photos. Setting this is what switches the feature on: the form
      # hides its photo control and the upload endpoint answers 503 without it.
      PHOTOS_DIR: /srv/photos
    volumes:
      - photos:/srv/photos
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Deletes photos past their retention window, once a day.
  #
  # The form tells customers their photos are kept for a year and then deleted.
  # A promise with nothing enforcing it is a sentence on a web page, so this runs
  # whether or not anybody remembers it exists -- which, on a box nobody logs
  # into for months, is the only kind of cleanup that actually happens.
  #
  # Same image as the app, so it needs no build of its own and cannot drift from
  # the code that wrote the rows. The loop mirrors the certbot service below
  # rather than inventing a second scheduling style for the same stack.
  photo-prune:
    image: proline-app:latest
    restart: unless-stopped
    env_file: /srv/proline/.env
    # It is the app's image but not the app: no server listens in here, so the
    # image's own healthcheck (curl :8000/healthz) can only ever fail. Left on, this
    # container sat at `(unhealthy)` forever in `docker ps` -- which is worse than
    # useless, because it trains you to ignore that column on the containers where
    # it means something.
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      PHOTOS_DIR: /srv/photos
    volumes:
      - photos:/srv/photos
    depends_on:
      db: {condition: service_healthy}
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          python -m scripts.prune_photos || true
          sleep 24h & wait $${!}
        done

  # TLS and routing. nginx serves, certbot below keeps the certificate alive --
  # two containers doing what Caddy did in one, which is the trade accepted when
  # this moved to nginx. The seam between them is the certbot_conf volume.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      # From the git checkout, read-only. No copy at /srv/proline to drift: a
      # `git pull` updates the config and the next reload picks it up.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Read-only here on purpose -- only certbot writes certificates.
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Not load-bearing any more: the config names its upstream through a variable
    # so nginx starts whether or not `app` resolves. Kept because starting in
    # order avoids a pointless window of 502s on a cold boot.
    depends_on:
      app: {condition: service_started}
    healthcheck:
      # Answered by the catch-all server block, so this reports on nginx itself
      # rather than on DNS, TLS and the app all being right.
      #
      # 127.0.0.1, NOT `localhost`. This config listens on IPv4 only, on purpose
      # -- the instance is IPv4 only (compute.py) and `listen [::]:80` fails to
      # bind where there is no IPv6. But a container's /etc/hosts maps `localhost`
      # to BOTH 127.0.0.1 and ::1, and busybox wget will happily try ::1 first and
      # give up there rather than falling back. The result is a permanently
      # `(unhealthy)` nginx that is in fact serving every request correctly --
      # a health check that only ever reported on itself.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # THIS RELOAD LOOP IS WHAT REPLACES CADDY'S BIGGEST CONVENIENCE. A renewed
    # certificate on disk does nothing until nginx re-reads it, and certbot runs
    # in its own container so it cannot signal this one -- no shared PID
    # namespace, and mounting the docker socket to get one would hand a web
    # server root on the host. So nginx reloads itself on a timer. A reload is
    # graceful, costs nothing, and six hours is comfortably inside certbot's
    # 30-day renewal margin.
    #
    # Without it the failure is the nasty kind: the renewal succeeds, the logs
    # look clean, and the site goes down 90 days later when the certificate
    # nginx is still holding in memory finally expires.
    #
    # Going through `sh` rather than the image's entrypoint is also deliberate:
    # that entrypoint's init scripts want to WRITE into /etc/nginx/conf.d, which
    # is mounted read-only above, and a failing init script aborts the container.
    # Nothing they do is needed here -- there are no envsubst templates, the
    # stock nginx.conf already has `worker_processes auto`, and this config sets
    # its own resolver.
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec nginx -g 'daemon off;'

  # Renews the certificate. Issuing the FIRST one needs nginx already running,
  # which is a loop this cannot break on its own -- infra/nginx/init-letsencrypt.sh
  # does that once, by hand. After that this container is the whole story.
  certbot:
    # Not pinned, because a certbot too old for a future ACME change fails in a
    # way nobody is watching for, and a tag guessed wrong here fails the deploy
    # outright. Record what you actually got, and pin it once you have:
    #   docker compose -f infra/docker-compose.prod.yml run --rm \
    #     --entrypoint certbot certbot --version
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      nginx: {condition: service_started}
    # `certbot renew` is a no-op until something is due, and a no-op when nothing
    # is issued yet -- so this is safe to start before the first certificate
    # exists. Twice a day is what Let's Encrypt asks for: it renews at 30 days
    # remaining, so there are ~60 chances to succeed before anything breaks.
    # `wait $${!}` rather than a bare sleep so `docker compose down` is instant.
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done

secrets:
  db_password:
    file: /srv/proline/db_password

volumes:
  pgdata:
  # The certificate and its private key, and the renewal config that remembers
  # how it was issued. Covered by the daily snapshot. Deleting this volume means
  # issuing from scratch -- fine, but Let's Encrypt allows 5 identical
  # certificates per week, so it is not something to do repeatedly while
  # debugging.
  certbot_conf:
  # The ACME challenge webroot: certbot writes a token here, nginx serves it.
  # Nothing in it needs to survive; it exists only to be shared between the two.
  certbot_www:
  # Customer photos. On the same disk as pgdata, which is the reason the app
  # caps both their size and their number: a full disk stops Postgres accepting
  # writes, and that loses leads. Watch it with `df -h /` -- see infra/DEPLOY.md.
  photos:
