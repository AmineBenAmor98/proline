# Deploy target: Toronto, the only Canadian region on Fly.
app = "proline"
primary_region = "yyz"

[build]
  dockerfile = "../Dockerfile"

[env]
  ENVIRONMENT = "production"
  FRONTEND_DIR = "/app/frontend"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"
