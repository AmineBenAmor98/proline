<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Proline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Karla:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="goldbar"></div>
<header class="site-header">
  <div class="container" style="display:flex;align-items:center;gap:24px;width:100%">
    <a class="brand" href="/"><img src="/img/logo.png" alt="Proline Cleaning Solutions" width="48" height="48">
      <span><span class="brand-name">PROLINE</span><br><span class="brand-sub">Admin</span></span></a>
    <nav class="site-nav">
      <button class="btn btn-ghost" id="refresh-btn" type="button">Rafraîchir</button>
      <button class="btn btn-ghost" id="logout-btn" type="button" hidden>Oublier le jeton</button>
    </nav>
  </div>
</header>

<main class="container" style="padding:32px 0">

  <section id="login" hidden>
    <h1>Accès admin</h1>
    <p class="lead" style="margin:12px 0 20px">Entrez le jeton d'administration (ADMIN_TOKEN). Il reste dans ce navigateur.</p>
    <form id="login-form" style="max-width:420px">
      <div class="field">
        <label for="token">Jeton</label>
        <input type="password" id="token" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="alert" hidden role="alert"></div>
      <button class="btn btn-primary" type="submit">Entrer</button>
    </form>
  </section>

  <section id="panel" hidden>
    <h1>Demandes</h1>
    <div class="stat-row" id="stats"></div>

    <div class="choice-row" style="margin-bottom:18px">
      <label class="choice"><input type="radio" name="status" value="" checked> Toutes</label>
      <label class="choice"><input type="radio" name="status" value="new"> Nouvelles</label>
      <label class="choice"><input type="radio" name="status" value="priced"> Chiffrées</label>
      <label class="choice"><input type="radio" name="status" value="quoted"> Envoyées</label>
      <label class="choice"><input type="radio" name="status" value="won"> Gagnées</label>
      <label class="choice"><input type="radio" name="status" value="lost"> Perdues</label>
    </div>

    <div id="panel-error" class="alert" hidden role="alert"></div>
    <p id="empty" class="note" hidden>Aucune demande pour ce filtre.</p>

    <div style="overflow-x:auto">
      <table class="admin-table" id="requests">
        <thead>
          <tr>
            <th>Reçue</th><th>Client</th><th>Propriété</th><th>Besoin</th>
            <th>Prix calculé</th><th>Prix envoyé</th><th>Statut</th><th>Source</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/js/admin.js"></script>
</body>
</html>
