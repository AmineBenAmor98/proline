<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Proline Cleaning Solutions</title>
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Karla:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-body">

<!-- Panel -->
<div id="panel" hidden>
  <div class="goldbar"></div>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/admin">
        <img src="/img/logo.png" alt="" width="42" height="42">
        <span class="brand-text">
          <span class="brand-name">PROLINE</span>
          <span class="brand-sub">Admin</span>
        </span>
      </a>
      <nav class="site-nav">
        <a class="navlink" href="/admin" aria-current="page">Demandes</a>
        <a class="navlink" href="/admin/tarifs">Tarifs</a>
        <a class="navlink" href="/" target="_blank" rel="noopener">Voir le site</a>
        <span class="lang" id="who"></span>
        <button class="btn btn-ghost" id="refresh-btn" type="button">Rafraîchir</button>
        <button class="btn btn-ghost" id="logout-btn" type="button">Déconnexion</button>
      </nav>
    </div>
  </header>

  <main class="container admin-wrap">
    <div class="section-head">
      <span class="eyebrow">Demandes</span>
      <h1>Boîte de réception</h1>
    </div>

    <div class="stat-row" id="stats"></div>

    <div class="choice-row" style="margin-bottom:20px" id="filters">
      <label class="choice"><input type="radio" name="status" value="" checked> Toutes</label>
      <label class="choice"><input type="radio" name="status" value="new"> Nouvelles</label>
      <label class="choice"><input type="radio" name="status" value="quoted"> Envoyées</label>
      <label class="choice"><input type="radio" name="status" value="won"> Gagnées</label>
      <label class="choice"><input type="radio" name="status" value="lost"> Perdues</label>
    </div>

    <div id="panel-error" class="alert" hidden role="alert"></div>
    <p id="empty" class="note" hidden>Aucune demande pour ce filtre.</p>

    <div class="table-wrap">
      <table class="admin-table" id="requests">
        <thead>
          <tr>
            <th>Reçue</th><th>Client</th><th>Propriété</th><th>Besoin</th>
            <th>Prix calculé</th><th>Prix envoyé</th><th>Statut</th><th>Source</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="note" style="margin-top:14px">Le prix envoyé se sauvegarde quand vous quittez le champ, et fait passer une demande « Nouvelle » à « Envoyée ».</p>
  </main>
</div>

<script src="/js/admin-common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
